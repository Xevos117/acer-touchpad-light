[package]
name = "acer-touchpad-light"
version = "0.1.0"
edition = "2024"
description = "Control the touchpad AI-lighting LEDs of the Acer Swift 14 AI on Linux"
license = "MIT"
repository = "https://github.com/Xevos117/acer-touchpad-light"
readme = "README.md"

[[bin]]
name = "tplight"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.8"
toml_edit = "0.22"
